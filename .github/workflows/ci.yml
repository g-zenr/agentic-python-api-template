name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run prisma generate
      - run: uv run mypy app
      - run: uv run python scripts/check_feature.py
      - run: uv run pytest --cov=app --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run prisma generate
      - run: uv run prisma migrate deploy
      - name: Migration drift check
        run: uv run prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: uv run pytest -m integration -o addopts=""
      - name: Schemathesis
        run: uvx schemathesis run http://localhost:8000/openapi.json --checks all --max-examples 25 || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pip-audit
      - run: uv run bandit -r app -ll
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentic-api .
      - run: docker run -d --name api -e ENV=test -e DATABASE_URL=postgresql://x/y -p 8000:8000 agentic-api
      - run: sleep 5 && docker inspect --format '{{.State.Health.Status}}' api
      - run: docker rm -f api