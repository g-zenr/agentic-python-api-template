name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run prisma generate
      - run: uv run mypy app
      - run: uv run python scripts/check_feature.py
      - run: uv run pytest --cov=app --cov-fail-under=80
      - name: Blocking latency SLO
        run: make test-slo

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run prisma generate
      - run: uv run prisma migrate deploy
      - name: Migration drift check
        run: uv run prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: uv run pytest -m integration -o addopts=""
      - name: Schemathesis
        env:
          ENV: test
          MCP_ENABLED: 'false'
          WORKER_EMBEDDED: 'false'
          RATE_LIMIT_ENABLED: 'false'
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health/live
          uvx schemathesis run http://127.0.0.1:8000/openapi.json --checks all --max-examples 25

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pip-audit
      - run: uv run bandit -r app -ll
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentic-api .
      - run: docker run -d --name api -e ENV=test -e DATABASE_URL=postgresql://x/y -p 8000:8000 agentic-api
      - name: Assert container health
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
      - if: always()
        run: docker rm -f api